# Railway service config for deepquill (set Root Directory = deepquill in Railway dashboard).
# Jody staging: create service deepquill-jody-preview, attach new Postgres, deploy branch test/jody-phase1-preview.

[build]
builder = "NIXPACKS"
buildCommand = "npm install && npx prisma generate"

[deploy]
startCommand = "npm start"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
